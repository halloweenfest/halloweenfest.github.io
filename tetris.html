document.querySelectorAll(".dock button").forEach(btn => {
  const fire = (e) => { e.preventDefault(); act(btn.dataset.act); };
  btn.addEventListener("pointerdown", fire);
});
addEventListener("keydown", (e) => {
  const map = {ArrowLeft:"left", ArrowRight:"right", ArrowDown:"down", ArrowUp:"rot", " ":"drop", z:"rot", x:"rot"};
  if (map[e.key]) { e.preventDefault(); if (!running && !over) start(); else act(map[e.key]); }
});
let swipeX = 0, swipeY = 0;
board.addEventListener("pointerdown", (e) => { swipeX = e.clientX; swipeY = e.clientY; });
board.addEventListener("pointerup", (e) => {
  const dx = e.clientX - swipeX, dy = e.clientY - swipeY;
  if (Math.abs(dx) < 18 && Math.abs(dy) < 18) act("rot");
  else if (Math.abs(dx) > Math.abs(dy)) act(dx < 0 ? "left" : "right");
  else act(dy > 0 ? "down" : "drop");
});
document.getElementById("playBtn").onclick = start;
document.getElementById("soundBtn").onclick = () => {
  soundOn = !soundOn;
  document.getElementById("soundBtn").textContent = soundOn ? "Sound" : "Muted";
};
TYPES.forEach(t => {
  const c = document.createElement("canvas");
  c.width = 36; c.height = 36;
  face(c.getContext("2d"), t, 0, 0, 36);
  document.getElementById("cast").appendChild(c);
});
addEventListener("resize", resize);
resize();
drawNext();
</script>
</body>
</html>
